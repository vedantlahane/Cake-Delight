<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Cake Delight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Minimal Header for Auth -->
  <header class="navbar">
    <div class="nav-container" style="justify-content: center;">
      <a href="index.html" class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/>
          <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4-2 2-1 2-1"/>
          <path d="M2 21h20"/>
          <path d="M7 8v2"/>
          <path d="M12 8v2"/>
          <path d="M17 8v2"/>
          <path d="M7 4h.01"/>
          <path d="M12 4h.01"/>
          <path d="M17 4h.01"/>
        </svg>
        <span class="brand-name">Cake Delight</span>
      </a>
    </div>
  </header>

  <div class="container auth-container">
    <div class="card auth-card">
      <div class="auth-header">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <h2>Welcome Back</h2>
        <p style="color: var(--text-muted); margin-top: 8px;">Sign in to manage your orders</p>
      </div>

      <div id="login-step-1">
        <div class="form-group">
          <label for="login-userId">User ID</label>
          <input type="text" id="login-userId" placeholder="Enter User ID (e.g. alex)" />
        </div>
        <button id="request-otp-btn" class="btn btn-primary full-width">
          Send OTP
        </button>
      </div>

      <div id="login-step-2" style="display: none;">
        <div class="form-group">
          <label for="login-otp">Verification Code</label>
          <input type="text" id="login-otp" placeholder="Enter 6-digit OTP" />
        </div>
        <button id="login-btn" class="btn btn-primary full-width">
          Sign In
        </button>
      </div>

      <div id="otp-message" class="status-box" style="display: none; margin-top: 20px;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Cake Delight</title>
  <meta name="description" content="Sign in to Cake Delight to manage your orders, basket, and account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-container"></div>

  <!-- Minimal navbar -->
  <header class="navbar">
    <div class="nav-container" style="justify-content:space-between;">
      <a href="index.html" class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/>
          <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/>
          <path d="M2 21h20"/><path d="M7 8v2"/><path d="M12 8v2"/><path d="M17 8v2"/>
          <path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/>
        </svg>
        <span class="brand-name">Cake Delight</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Back to Store
      </a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Card Header -->
      <div class="auth-card-header">
        <div class="auth-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to manage your orders &amp; basket</p>
      </div>

      <!-- Card Body -->
      <div class="auth-card-body">
        <!-- Step 1: Enter email / userId -->
        <div id="login-step-1">
          <div class="form-group">
            <label for="login-userId">Email / User ID</label>
            <input type="email" id="login-userId" placeholder="e.g. user@example.com" autocomplete="email" />
          </div>
          <button id="request-otp-btn" class="btn btn-primary full-width btn-lg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.81a16 16 0 0 0 6.29 6.29l.97-.97a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Send OTP
          </button>

          <div class="auth-divider">Quick Demo Login</div>

          <div class="demo-buttons">
            <button id="demo-admin-btn" class="demo-btn">
              <div class="demo-btn-icon admin">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              </div>
              <div class="demo-btn-text">
                <strong>Admin Demo Login</strong>
                <span>admin@cakedelight.com</span>
              </div>
            </button>
            <button id="demo-customer-btn" class="demo-btn">
              <div class="demo-btn-icon customer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <div class="demo-btn-text">
                <strong>Customer Demo Login</strong>
                <span>customer@cakedelight.com</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Step 2: Enter OTP -->
        <div id="login-step-2" style="display:none;">
          <div class="status-box info" id="otp-hint" style="margin-bottom:16px;margin-top:0;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="otp-hint-text">Check your email for the OTP</span>
          </div>
          <div class="form-group">
            <label for="login-otp">Verification Code (OTP)</label>
            <input type="text" id="login-otp" placeholder="Enter 6-digit OTP" maxlength="6" autocomplete="one-time-code" />
          </div>
          <button id="login-btn" class="btn btn-primary full-width btn-lg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Sign In
          </button>
          <button id="back-to-step1" class="btn btn-outline full-width" style="margin-top:10px;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            Use different email
          </button>
        </div>

        <div id="otp-message" class="status-box" style="display:none; margin-top:14px;"></div>
      </div>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>

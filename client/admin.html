<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Cake Delight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <!-- Shield Icon for Admin -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span class="brand-name">Admin Dashboard</span>
      </div>
      <div>
        <a href="index.html" class="btn btn-outline btn-sm" style="text-decoration: none;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          Back to Store
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        System Dashboard
      </h1>
      <p style="color: var(--text-muted);">Monitor real-time orders and email notifications across the platform.</p>
    </div>

    <div class="dashboard-grid">
      <!-- Orders Table -->
      <div class="card">
        <h2 style="font-size: 1.25rem; margin-bottom: 16px;">Global Orders</h2>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>User</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="admin-orders-list">
              <tr><td colspan="5" class="empty-msg">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Notifications Table -->
      <div class="card">
        <h2 style="font-size: 1.25rem; margin-bottom: 16px;">System Notifications</h2>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>User</th>
                <th>Channel</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="admin-notifications-list">
              <tr><td colspan="5" class="empty-msg">Loading notifications...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: cake-delight
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports:
            - containerPort: 1025 #this is the port that the container is listening on for SMTP traffic
              name: smtp
            - containerPort: 8025 #this is the port that the container is listening on for the web UI
              name: webui
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: cake-delight
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
    - name: smtp # SMTP port for sending emails
      port: 1025 # this is the port that the service will expose within the cluster
      targetPort: 1025 # this is the port that the container is listening on
    - name: webui 
      port: 8025 # this is the port that the service will expose within the cluster
      targetPort: 8025 # this is the port that the container is listening on
      nodePort: 30025 # this is the port that will be exposed on each node in the cluster, allowing external access to the web UI
